name: Sync Releases

on:
  release:
    types:
      - published
      - edited

  workflow_dispatch:
    inputs:
      tag:
        description: "指定要同步的 Tag；留空则同步全部 Releases"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_REPOSITORY: ${{ github.repository }}

      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: StartYi
      GITEE_REPO: CalculatorX

      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_OWNER: StartYi
      GITCODE_REPO: CalculatorX

      SYNC_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: >
          python -m pip install
          --disable-pip-version-check
          requests

      - name: Sync release metadata
        run: python .github/scripts/sync-releases.py