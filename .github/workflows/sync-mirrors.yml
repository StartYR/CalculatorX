name: Sync Repository Mirrors

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sync-repository-mirrors
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to Gitee and GitCode
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          GITCODE_SSH_PRIVATE_KEY: ${{ secrets.GITCODE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/gitee
          printf '%s\n' "$GITCODE_SSH_PRIVATE_KEY" > ~/.ssh/gitcode

          chmod 600 ~/.ssh/gitee ~/.ssh/gitcode

          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          ssh-keyscan gitcode.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host gitee-mirror
            HostName gitee.com
            User git
            IdentityFile ~/.ssh/gitee
            IdentitiesOnly yes

          Host gitcode-mirror
            HostName gitcode.com
            User git
            IdentityFile ~/.ssh/gitcode
            IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repository.git

      - name: Show README notice on mirrors
        run: |
          set -euo pipefail

          # 始终基于 GitHub main 创建镜像专属提交，避免积累历史。
          git -C repository.git worktree add --detach ../mirror-worktree refs/heads/main
          cd mirror-worktree
          source_sha="$(git rev-parse HEAD)"

          # 下载统计卡片到镜像仓库内部；请求失败时不推送不完整的镜像。
          mkdir -p docs/image
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 25 \
            'https://github-readme-stats.vercel.app/api/pin/?username=StartYR&repo=CalculatorX&theme=transparent&show_owner=true&description_lines_count=1&cache_seconds=21600' \
            --output docs/image/github-stats.svg

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # 检查下载内容，防止服务端错误页面被保存为 SVG。
          svg_path = Path("docs/image/github-stats.svg")
          svg = svg_path.read_bytes()
          if not (1024 <= len(svg) <= 200_000):
              raise SystemExit("统计卡片 SVG 文件大小异常")
          try:
              root = ET.fromstring(svg)
          except ET.ParseError as exc:
              raise SystemExit(f"统计卡片 SVG 解析失败: {exc}") from exc
          if root.tag != "{http://www.w3.org/2000/svg}svg" or b"CalculatorX" not in svg:
              raise SystemExit("下载内容不是预期的 CalculatorX SVG 卡片")
          if any(message in svg for message in (b"Could not fetch", b"Something went wrong")):
              raise SystemExit("统计卡片服务返回错误信息")

          readme_path = Path("README.md")
          content = readme_path.read_bytes()
          start_marker = b"<!-- MIRROR_NOTICE_START -->"
          end_marker = b"<!-- MIRROR_NOTICE_END -->"

          if content.count(start_marker) != 1 or content.count(end_marker) != 1:
              raise SystemExit("README 镜像提示的起止标记必须各出现一次")

          start = content.index(start_marker) + len(start_marker)
          end = content.index(end_marker)
          if start >= end:
              raise SystemExit("README 镜像提示的起止标记顺序错误")

          # 只解除正文外层注释，保留标记、正文和文件原有换行。
          region = content[start:end]
          match = re.fullmatch(
              rb"(?P<newline>\r?\n)[ \t]*<!--[ \t]*\r?\n"
              rb"(?P<body>.*?)\r?\n[ \t]*-->[ \t]*\r?\n",
              region,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("README 镜像提示必须由独立行的 HTML 注释完整包裹")

          body = match.group("body")
          if not body.strip() or b"<!--" in body or b"-->" in body:
              raise SystemExit("README 镜像提示正文不能为空，也不能嵌套 HTML 注释")

          newline = match.group("newline")
          readme_path.write_bytes(content[:start] + newline + body + newline + content[end:])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs/image/github-stats.svg
          git commit -m "docs: 更新镜像仓库说明和统计卡片"

          # 让待推送的裸仓库 main 指向完整的镜像专属提交。
          # 后续一次 push --mirror 即可同步全部内容，避免先覆盖再补图。
          mirror_commit="$(git rev-parse HEAD)"
          git -C ../repository.git update-ref refs/heads/main "$mirror_commit" "$source_sha"

      - name: Sync to Gitee
        run: |
          set -euo pipefail
          cd repository.git
          git push --mirror git@gitee-mirror:StartYi/CalculatorX.git

      - name: Sync to GitCode
        run: |
          set -euo pipefail
          cd repository.git
          git push --mirror git@gitcode-mirror:StartYi/CalculatorX.git
