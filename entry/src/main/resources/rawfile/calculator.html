<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="./compute-engine.min.js"></script>
    <script src="./mathlive.min.js"></script>
    <style>
        /* ========== 1. 主题变量 ========== */
        :root {
            --bg-color: #F1F3F5;
            --text-color: #1A1C1E;
            --result-color: #494949;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #FFFFFF;
                --result-color: #e2e2e2;
            }
        }

        /* ========== 2. 页面基础 ========== */
        html,
        body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            height: 100vh;
            margin: 0;
            padding: 48px 16px 20px 16px;
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-touch-callout: none;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        /* ========== 3. math-field 共用基础 ========== */
        math-field {
            width: fit-content;
            max-width: 100%;
            min-width: 40px;
            background-color: transparent;
            border: none;
            color: var(--text-color);
            --placeholder-color: var(--text-color);
            --placeholder-opacity: 0.35;
            transition: color 0.3s ease;
        }

        /* ========== 4. 输入区 ========== */
        .input-scroll-wrapper {
            margin-top: auto;
            /* 顶住上方空间，将自己推到最下方 */
            max-width: 100%;
            min-width: 0;
            /* 允许比内部公式窄，触发滚动 */
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        #math-input {
            font-size: 3rem; /* 初始最大字号 */
            display: block;
            width: max-content;
            max-width: none !important;
            touch-action: pan-x;
        }

        #math-input:focus-within {
            outline: none;
        }

        #math-input::part(virtual-keyboard-toggle),
        #math-input::part(menu-toggle) {
            display: none;
        }

        /* ========== 5. 结果区 ========== */
        .result-scroll-wrapper {
            max-width: 100%;
            /* 限制最宽只能和屏幕一样大 */
            margin-top: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        #math-result {
            font-size: 3rem; /* 初始最大字号 */
            color: var(--result-color);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            display: block;
            width: max-content;
            max-width: none !important;
            padding-right: 2px;
        }

        #math-result.show {
            opacity: 1;
        }
    </style>
</head>

<body>
<div class="input-scroll-wrapper">
    <math-field id="math-input" math-virtual-keyboard-policy="manual"></math-field>
</div>
<div class="result-scroll-wrapper">
    <math-field id="math-result" read-only></math-field>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const mf = document.getElementById('math-input');
        const resField = document.getElementById('math-result');
        const inputWrapper = document.querySelector('.input-scroll-wrapper');
        const resWrapper = document.querySelector('.result-scroll-wrapper');

        // ========== 通用的动态字号缩放核心核心算法 ==========
        function autoScaleFontSize(field, wrapper, maxRem, minRem) {
            // 1. 先强制恢复到最大初始字号，以此来测量公式如果不受限时的真实最大宽度
            field.style.fontSize = maxRem + 'rem';

            const wrapperWidth = wrapper.clientWidth;
            const fieldWidth = field.getBoundingClientRect().width;

            // 2. 如果最大字号下的宽度撑满了容器，开始触发缩放逻辑
            if (fieldWidth > wrapperWidth && wrapperWidth > 0) {
                // 按物理比例精确计算应该缩小的字号大小（预留5px富余防止贴边抖动）
                let optimizedFont = maxRem * ((wrapperWidth - 5) / fieldWidth);

                // 3. 边界防御：如果计算出的字号比设定的最小值还小，直接锁死在最小值
                if (optimizedFont < minRem) {
                    optimizedFont = minRem;
                }
                // 4. 赋予新字号
                field.style.fontSize = optimizedFont + 'rem';
            }
        }

        // ========== 光标自动追踪探头 ==========
        window.keepCaretInView = function () {
            // 给渲染引擎 30ms 的时间更新 DOM，确保拿到的是最新位置
            setTimeout(() => {
                const shadow = mf.shadowRoot;
                if (!inputWrapper || !shadow) return;

                // 寻找 MathLive 正在闪烁的光标元素
                const caret = shadow.querySelector('.ML__caret, .ML__text-caret');

                if (caret) {
                    const wRect = inputWrapper.getBoundingClientRect();
                    const cRect = caret.getBoundingClientRect();

                    const padding = 35; // 呼吸空间：不让光标紧贴屏幕边缘，提前 35px 滚动

                    if (cRect.right > wRect.right) {
                        // 光标越过右边界，向右追尾
                        inputWrapper.scrollLeft += (cRect.right - wRect.right + padding);
                    } else if (cRect.left < wRect.left) {
                        // 光标越过左边界，向左回溯
                        inputWrapper.scrollLeft -= (wRect.left - cRect.left + padding);
                    }
                } else {
                    // 保底策略
                    inputWrapper.scrollLeft = inputWrapper.scrollWidth;
                }
            }, 30);
        };

        // ========== 劫持 MathLive 的底层执行核心 ==========
        const originalExecute = mf.executeCommand.bind(mf);
        mf.executeCommand = function (...args) {
            const result = originalExecute(...args);

            // 【高级进化】：每次输入/删除内容发生改变，先动态伸缩字号
            // 输入框：最大 2.5rem，最小缩到 1.6rem
            autoScaleFontSize(mf, inputWrapper, 3.0, 2.0);

            // 字号缩放完成后，再去计算光标追踪轨道的安全视口
            window.keepCaretInView();
            return result;
        };

        // 清空 MathLive 内置菜单项
        mf.menuItems = [];

        // 拦截浏览器原生的长按/右键菜单事件
        mf.addEventListener('contextmenu', function (event) {
            event.preventDefault();
            event.stopPropagation();
        });

        mf.focus();


        window.showResult = function (latexString) {
            resField.value = latexString;
            resField.classList.add('show');

            // 【高级进化】：输出结果动态缩放
            // 结果框：最大 2.0rem，最小缩到 1.3rem
            setTimeout(() => {
                autoScaleFontSize(resField, resWrapper, 3.0, 2.0);
            }, 10);
        };

        mf.addEventListener('input', () => {
            resField.classList.remove('show');
        });

        window.insertMath = function (latexString) {
            const currentLatex = mf.value;
            // 正则判断当前公式最后是不是以“秒”结尾（兼容 MathLive 的空格排版）
            const isEndsWithSecond = /\^\{\\prime\s*\\prime\}\s*$/.test(currentLatex);

            // 【拦截逻辑】：如果前方是秒，并且当前传入的是纯数字 (0-9)
            if (isEndsWithSecond && /^[0-9]$/.test(latexString)) {
                return; // 直接返回，吞噬按键
            }

            mf.executeCommand(['insert', latexString]);
            mf.focus();
        };

        // 度分秒专属的智能插入与拦截
        window.insertDMS = function () {
            const currentLatex = mf.value;

            // 【拦截逻辑】：如果前方紧挨着已经是“秒”了，直接禁止再次输入度分秒
            const isEndsWithSecond = /\^\{\\prime\s*\\prime\}\s*$/.test(currentLatex);
            if (isEndsWithSecond) {
                return; // 直接返回，吞噬按键
            }

            // 查找最后一个出现的度、分、秒符号的索引
            const lastDegree = currentLatex.lastIndexOf('^{\\circ}');
            const lastMinute = currentLatex.lastIndexOf('^{\\prime}');
            const lastSecond1 = currentLatex.lastIndexOf('^{\\prime\\prime}');
            const lastSecond2 = currentLatex.lastIndexOf('^{\\prime \\ dynamic}');
            const lastSecond = Math.max(lastSecond1, lastSecond2);

            const maxIndex = Math.max(lastDegree, lastMinute, lastSecond);

            let toInsert = '^{\\circ}'; // 默认状态：插入度 (°)

            if (maxIndex !== -1) {
                if (maxIndex === lastDegree) {
                    toInsert = '^{\\prime}';        // 紧挨着度：插入分 (')
                } else if (maxIndex === lastMinute) {
                    toInsert = '^{\\prime\\prime}'; // 紧挨着分：插入秒 (")
                } else if (maxIndex === lastSecond) {
                    toInsert = '^{\\circ}';
                }
            }

            mf.executeCommand(['insert', toInsert]);
            mf.focus();
        };

        window.clearMath = function () {
            mf.executeCommand('deleteAll');
            resField.classList.remove('show');
            resField.value = '';
            mf.focus();
        };

        window.deleteMath = function () {
            mf.executeCommand('deleteBackward');
            mf.focus();
        };

        window.getFormula = function () {
            return mf.value;
        };

        window.getMathJSON = function () {
            const jsonAST = mf.getValue('math-json');
            return JSON.stringify(jsonAST);
        };

        // ========== 输入区滑动拦截 ==========
        let isPanning = false;
        let startX = 0;
        let initialScrollLeft = 0;

        // 1. 捕获手指按下
        inputWrapper.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'touch') return;
            isPanning = false;
            startX = e.clientX;
            initialScrollLeft = inputWrapper.scrollLeft;
        }, { capture: true });

        // 2. 捕获手指移动
        inputWrapper.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'touch') return;

            const deltaX = e.clientX - startX;

            // 如果水平移动超过 8px，判定这是“滑动滚动”，而不是“点击插光标”
            if (!isPanning && Math.abs(deltaX) > 8) {
                isPanning = true;

                // 一旦确认是滑动，立刻发送一个 pointercancel，强行打断选中/光标移动逻辑
                mf.dispatchEvent(new PointerEvent('pointercancel', {
                    pointerId: e.pointerId,
                    pointerType: 'touch'
                }));
            }

            // 如果确认是滑动状态
            if (isPanning) {
                // 接管滚动权，强行推着 Wrapper 跑
                inputWrapper.scrollLeft = initialScrollLeft - deltaX;

                // 把事件就地销毁，不把滑动过程传递到下层的 MathLive
                e.stopPropagation();
                e.preventDefault();
            }
        }, { capture: true });

        // 3. 捕获手指抬起
        inputWrapper.addEventListener('pointerup', (e) => {
            if (e.pointerType !== 'touch') return;
            if (isPanning) {
                e.stopPropagation();
                isPanning = false;
            }
        }, { capture: true });
    });
</script>
</body>

</html>
