<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="./compute-engine.min.js"></script>
    <script src="./mathlive.min.js"></script>
    <style>
        /* ========== 1. 主题变量 ========== */
        :root {
            --bg-color: #F1F3F5;
            --text-color: #1A1C1E;
            --result-color: #494949;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #FFFFFF;
                --result-color: #e2e2e2;
            }
        }

        /* ========== 2. 页面基础 ========== */
        html,
        body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            height: 100vh;
            margin: 0;
            padding: 48px 16px 20px 16px;
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-touch-callout: none;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        /* ========== 3. math-field 共用基础 ========== */
        math-field {
            width: fit-content;
            max-width: 100%;
            min-width: 40px;
            background-color: transparent;
            border: none;
            color: var(--text-color);
            --placeholder-color: var(--text-color);
            --placeholder-opacity: 0.35;
            transition: color 0.3s ease;
        }

        /* ========== 4. 输入区 ========== */
        .input-scroll-wrapper {
            margin-top: auto;
            /* 顶住上方空间，将自己推到最下方 */
            max-width: 100%;
            min-width: 0;
            /* 允许比内部公式窄，触发滚动 */
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        #math-input {
            font-size: 3rem; /* 初始最大字号 */
            display: block;
            width: max-content;
            max-width: none !important;
            touch-action: pan-x;
        }

        #math-input:focus-within {
            outline: none;
        }

        #math-input::part(virtual-keyboard-toggle),
        #math-input::part(menu-toggle) {
            display: none;
        }

        /* ========== 5. 结果区 ========== */
        .result-scroll-wrapper {
            max-width: 100%;
            /* 限制最宽只能和屏幕一样大 */
            margin-top: 8px;
            max-height: 35vh;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
            scrollbar-width: none;
        }

        #math-result {
            font-size: 3rem; /* 初始最大字号 */
            color: var(--result-color);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            display: block;
            width: max-content;
            max-width: none !important;
            padding-right: 2px;
        }

        #math-result.show {
            opacity: 1;
        }
    </style>
</head>

<body>
<div class="input-scroll-wrapper">
    <math-field id="math-input" math-virtual-keyboard-policy="manual"></math-field>
</div>
<div class="result-scroll-wrapper">
    <math-field id="math-result" read-only></math-field>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const mf = document.getElementById('math-input');
        const resField = document.getElementById('math-result');
        const inputWrapper = document.querySelector('.input-scroll-wrapper');
        const resWrapper = document.querySelector('.result-scroll-wrapper');

        // ========== 通用的动态字号缩放核心核心算法 ==========
        function autoScaleFontSize(field, wrapper, maxRem, minRem) {
            // 1. 恢复最大字号以便测量
            field.style.fontSize = maxRem + 'rem';

            const wWidth = wrapper.clientWidth;
            const wHeight = wrapper.clientHeight; // 新增：获取容器可视高度

            const fRect = field.getBoundingClientRect(); // 使用 getBoundingClientRect 获取渲染后的精确尺寸
            const fWidth = fRect.width;
            const fHeight = fRect.height; // 新增：获取公式的真实高度

            // 2. 检查：是否宽度溢出 OR 高度溢出
            // 只有当公式真实尺寸大于容器尺寸时，才触发计算
            if ((fWidth > wWidth || fHeight > wHeight) && wWidth > 0 && wHeight > 0) {

                // 计算两个维度的缩放比，取最小值，保证缩放后两个维度都不溢出
                const ratioW = (wWidth - 5) / fWidth;
                const ratioH = (wHeight - 5) / fHeight;
                const finalRatio = Math.min(ratioW, ratioH, 1.0); // 确保不会放大

                let optimizedFont = maxRem * finalRatio;

                // 3. 边界防御
                if (optimizedFont < minRem) {
                    optimizedFont = minRem;
                }

                field.style.fontSize = optimizedFont + 'rem';
            }
        }

        // ========== 光标自动追踪探头 ==========
        window.keepCaretInView = function () {
            setTimeout(() => {
                const shadow = mf.shadowRoot;
                if (!inputWrapper || !shadow) return;

                const caret = shadow.querySelector('.ML__caret, .ML__text-caret');

                if (caret) {
                    const wRect = inputWrapper.getBoundingClientRect();
                    const cRect = caret.getBoundingClientRect();

                    const paddingX = 35; // 横向呼吸空间
                    const paddingY = 20; // 纵向呼吸空间

                    // 横向追踪
                    if (cRect.right > wRect.right) {
                        inputWrapper.scrollLeft += (cRect.right - wRect.right + paddingX);
                    } else if (cRect.left < wRect.left) {
                        inputWrapper.scrollLeft -= (wRect.left - cRect.left + paddingX);
                    }

                    // 纵向追踪
                    if (cRect.bottom > wRect.bottom) {
                        inputWrapper.scrollTop += (cRect.bottom - wRect.bottom + paddingY);
                    } else if (cRect.top < wRect.top) {
                        inputWrapper.scrollTop -= (wRect.top - cRect.top + paddingY);
                    }
                } else {
                    inputWrapper.scrollLeft = inputWrapper.scrollWidth;
                }
            }, 30);
        };

        // ========== 劫持 MathLive 的底层执行核心 ==========
        const originalExecute = mf.executeCommand.bind(mf);
        mf.executeCommand = function (...args) {
            const result = originalExecute(...args);

            // 【高级进化】：每次输入/删除内容发生改变，先动态伸缩字号
            // 输入框：最大 2.5rem，最小缩到 1.6rem
            autoScaleFontSize(mf, inputWrapper, 3.0, 2.0);

            // 字号缩放完成后，再去计算光标追踪轨道的安全视口
            window.keepCaretInView();
            return result;
        };

        // 清空 MathLive 内置菜单项
        mf.menuItems = [];

        // 拦截浏览器原生的长按/右键菜单事件
        mf.addEventListener('contextmenu', function (event) {
            event.preventDefault();
            event.stopPropagation();
        });

        mf.focus();


        window.showResult = function (latexString) {
            resField.value = latexString;
            resField.classList.add('show');

            // 【高级进化】：输出结果动态缩放
            // 结果框：最大 2.0rem，最小缩到 1.3rem
            setTimeout(() => {
                void resField.offsetWidth; // 强制浏览器在测量前完成 DOM 重绘
                autoScaleFontSize(resField, resWrapper, 3.0, 2.0);// 执行动态缩放

                // 缩放完成后，如果达到了最小字号依然超长，自动将视角推到最右侧看结果末尾
                setTimeout(() => {
                    resWrapper.scrollLeft = resWrapper.scrollWidth;
                }, 20);

            }, 50);
        };

        mf.addEventListener('input', () => {
            resField.classList.remove('show');
        });

        window.insertMath = function (latexString) {
            const currentLatex = mf.value;
            // 正则判断当前公式最后是不是以“秒”结尾（兼容 MathLive 的空格排版）
            const isEndsWithSecond = /\^\{\\prime\s*\\prime\}\s*$/.test(currentLatex);

            // 【拦截逻辑】：如果前方是秒，并且当前传入的是纯数字 (0-9)
            if (isEndsWithSecond && /^[0-9]$/.test(latexString)) {
                return; // 直接返回，吞噬按键
            }

            mf.executeCommand(['insert', latexString]);
            mf.focus();
        };

        // 度分秒专属的智能插入与拦截
        window.insertDMS = function () {
            const currentLatex = mf.value;

            // 【拦截逻辑】：如果前方紧挨着已经是“秒”了，直接禁止再次输入度分秒
            const isEndsWithSecond = /\^\{\\prime\s*\\prime\}\s*$/.test(currentLatex);
            if (isEndsWithSecond) {
                return; // 直接返回，吞噬按键
            }

            // 查找最后一个出现的度、分、秒符号的索引
            const lastDegree = currentLatex.lastIndexOf('^{\\circ}');
            const lastMinute = currentLatex.lastIndexOf('^{\\prime}');
            const lastSecond1 = currentLatex.lastIndexOf('^{\\prime\\prime}');
            const lastSecond2 = currentLatex.lastIndexOf('^{\\prime \\ dynamic}');
            const lastSecond = Math.max(lastSecond1, lastSecond2);

            const maxIndex = Math.max(lastDegree, lastMinute, lastSecond);

            let toInsert = '^{\\circ}'; // 默认状态：插入度 (°)

            if (maxIndex !== -1) {
                if (maxIndex === lastDegree) {
                    toInsert = '^{\\prime}';        // 紧挨着度：插入分 (')
                } else if (maxIndex === lastMinute) {
                    toInsert = '^{\\prime\\prime}'; // 紧挨着分：插入秒 (")
                } else if (maxIndex === lastSecond) {
                    toInsert = '^{\\circ}';
                }
            }

            mf.executeCommand(['insert', toInsert]);
            mf.focus();
        };

        window.clearMath = function () {
            mf.executeCommand('deleteAll');
            resField.classList.remove('show');
            resField.value = '';
            mf.focus();
        };

        window.deleteMath = function () {
            mf.executeCommand('deleteBackward');
            mf.focus();
        };

        window.getFormula = function () {
            return mf.value;
        };

        window.getMathJSON = function () {
            const jsonAST = mf.getValue('math-json');
            return JSON.stringify(jsonAST);
        };

        // ========== 输入区滑动拦截 ==========
        let isPanning = false;
        let startX = 0; // X 起点
        let startY = 0; // Y 起点
        let initialScrollLeft = 0; // X 初始滚动值
        let initialScrollTop = 0; // Y 初始滚动值

        // 1. 捕获手指按下
        inputWrapper.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'touch') return;
            isPanning = false;
            startX = e.clientX;
            startY = e.clientY;
            initialScrollLeft = inputWrapper.scrollLeft;
            initialScrollTop = inputWrapper.scrollTop;
        }, { capture: true });

        // 2. 捕获手指移动
        inputWrapper.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'touch') return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY

            // 如果移动超过 8px，判定这是“滑动滚动”，而不是“点击插光标”
            if (!isPanning && (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8)) {
                isPanning = true;

                // 打断 MathLive 的蓝色选中
                mf.dispatchEvent(new PointerEvent('pointercancel', {
                    pointerId: e.pointerId,
                    pointerType: 'touch'
                }));
            }

            // 如果确认是滑动状态
            if (isPanning) {
                // 接管滚动权，强行推着 Wrapper 跑
                inputWrapper.scrollLeft = initialScrollLeft - deltaX;
                inputWrapper.scrollTop = initialScrollTop - deltaY;

                // 把事件就地销毁，不把滑动过程传递到下层的 MathLive
                e.stopPropagation();
                e.preventDefault();
            }
        }, { capture: true });

        // 3. 捕获手指抬起
        inputWrapper.addEventListener('pointerup', (e) => {
            if (e.pointerType !== 'touch') return;
            if (isPanning) {
                e.stopPropagation();
                isPanning = false;
            }
        }, { capture: true });
    });
</script>
</body>

</html>
