<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="./compute-engine.min.js"></script>
    <script src="./mathlive.min.js"></script>
    <style>
        :root {
            --bg-color: #F1F3F5;
            --text-color: #1A1C1E;
            --result-color: #494949;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #FFFFFF;
                --result-color: #e2e2e2;
            }
        }

        html,
        body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            height: 100vh;
            margin: 0;
            padding: 48px 16px 20px 16px;
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-touch-callout: none;
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        math-field {
            width: fit-content;
            max-width: 100%;
            min-width: 40px;
            background-color: transparent;
            border: none;
            color: var(--text-color);
            --placeholder-color: var(--text-color);
            --placeholder-opacity: 0.35;
            transition: color 0.3s ease;

        }

        .input-scroll-wrapper {
    margin-top: auto; /* 🌟 核心：从原 input 迁移过来，顶住上方空间，将自己推到最下方 */
    max-width: 100%;
    min-width: 0;     /* 允许比内部公式窄，触发滚动 */
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    scrollbar-width: none;
}

        #math-input {
    font-size: 2.5rem;
    display: block;
    width: max-content;
    max-width: none !important; /* 突破 100% 宽度封印 */

    /* 👇 核心防选中魔法 👇 */
    touch-action: pan-x; /* 强制浏览器层接管横向平移，物理打断 MathLive 的拖拽选中判定 */
}

        #math-input:focus-within {
            outline: none;
        }

        #math-input::part(virtual-keyboard-toggle),
        #math-input::part(menu-toggle) {
            display: none;
        }

        #math-result {
            font-size: 2.8rem;
            color: var(--result-color);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;

            display: block;
            width: max-content;
            max-width: none !important;
            padding-right: 2px;
        }

        #math-result.show {
            opacity: 1;
        }

        /* 专门负责原生滚动的外部容器 */
        .result-scroll-wrapper {
            max-width: 100%;
            /* 限制最宽只能和屏幕一样大 */
            margin-top: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
<div class="input-scroll-wrapper">
    <math-field id="math-input" math-virtual-keyboard-policy="manual"></math-field>
</div>
<div class="result-scroll-wrapper">
    <math-field id="math-result" read-only></math-field>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const mf = document.getElementById('math-input');
        const resField = document.getElementById('math-result');

        // 清空 MathLive 内置菜单项
        mf.menuItems = [];

        // 拦截浏览器原生的长按/右键菜单事件
        mf.addEventListener('contextmenu', function (event) {
            event.preventDefault();
            event.stopPropagation();
        });

        mf.focus();


        window.showResult = function (latexString) {
            resField.value = latexString;
            resField.classList.add('show');


    };

        mf.addEventListener('input', () => {
            resField.classList.remove('show');
        });

        window.insertMath = function (latexString) {
            const currentLatex = mf.value;
            // 正则判断当前公式最后是不是以“秒”结尾（兼容 MathLive 的空格排版）
            const isEndsWithSecond = /\^\{\\prime\s*\\prime\}\s*$/.test(currentLatex);

            // 【拦截逻辑】：如果前方是秒，并且当前传入的是纯数字 (0-9)
            if (isEndsWithSecond && /^[0-9]$/.test(latexString)) {
                return; // 直接返回，吞噬按键
            }

            mf.executeCommand(['insert', latexString]);
            mf.focus();
        };

        // 度分秒专属的智能插入与拦截
        window.insertDMS = function () {
            const currentLatex = mf.value;

            // 【拦截逻辑】：如果前方紧挨着已经是“秒”了，直接禁止再次输入度分秒
            const isEndsWithSecond = /\^\{\\prime\s*\\prime\}\s*$/.test(currentLatex);
            if (isEndsWithSecond) {
                return; // 直接返回，吞噬按键
            }

            // 查找最后一个出现的度、分、秒符号的索引
            const lastDegree = currentLatex.lastIndexOf('^{\\circ}');
            const lastMinute = currentLatex.lastIndexOf('^{\\prime}');
            const lastSecond1 = currentLatex.lastIndexOf('^{\\prime\\prime}');
            const lastSecond2 = currentLatex.lastIndexOf('^{\\prime \\prime}');
            const lastSecond = Math.max(lastSecond1, lastSecond2);

            const maxIndex = Math.max(lastDegree, lastMinute, lastSecond);

            let toInsert = '^{\\circ}'; // 默认状态：插入度 (°)

            if (maxIndex !== -1) {
                if (maxIndex === lastDegree) {
                    toInsert = '^{\\prime}';        // 紧挨着度：插入分 (')
                } else if (maxIndex === lastMinute) {
                    toInsert = '^{\\prime\\prime}'; // 紧挨着分：插入秒 (")
                } else if (maxIndex === lastSecond) {
                    // 因为上方已经拦截了紧挨着秒的情况，走到这里说明光标不在秒后面
                    // 比如 12°34'56" + 1，此时按下 DMS，开启新一轮的循环
                    toInsert = '^{\\circ}';
                }
            }

            mf.executeCommand(['insert', toInsert]);
            mf.focus();
        };

        window.clearMath = function () {
            mf.executeCommand('deleteAll');
            resField.classList.remove('show');
            resField.value = '';
            mf.focus();
        };

        window.deleteMath = function () {
            mf.executeCommand('deleteBackward');
            mf.focus();
        };

        window.getFormula = function () {
            return mf.value;
        };

        window.getMathJSON = function () {
            const jsonAST = mf.getValue('math-json');
            return JSON.stringify(jsonAST);
        };

        // 度分秒逻辑
        window.insertDMS = function () {
            const currentLatex = mf.value;

            // 查找最后一个出现的度、分、秒符号的索引
            const lastDegree = currentLatex.lastIndexOf('^{\\circ}');
            const lastMinute = currentLatex.lastIndexOf('^{\\prime}');

            // MathLive 内部对连续单引号的渲染可能有两种空格格式，做个兼容
            const lastSecond1 = currentLatex.lastIndexOf('^{\\prime\\prime}');
            const lastSecond2 = currentLatex.lastIndexOf('^{\\prime \\prime}');
            const lastSecond = Math.max(lastSecond1, lastSecond2);

            const maxIndex = Math.max(lastDegree, lastMinute, lastSecond);

            let toInsert = '^{\\circ}'; // 默认状态：插入度 (°)

            if (maxIndex !== -1) {
                if (maxIndex === lastDegree) {
                    toInsert = '^{\\prime}';        // 紧跟在度后面：插入分 (')
                } else if (maxIndex === lastMinute) {
                    toInsert = '^{\\prime\\prime}'; // 紧跟在分后面：插入秒 (")
                } else if (maxIndex === lastSecond) {
                    toInsert = '^{\\circ}';         // 紧跟在秒后面：开启下一个循环，插入度 (°)
                }
            }

            mf.executeCommand(['insert', toInsert]);
            mf.focus();
        };
        // ========== 输入区滑动拦截官 ==========
        const inputWrapper = document.querySelector('.input-scroll-wrapper');
        let isPanning = false;
        let startX = 0;
        let initialScrollLeft = 0;

        // 1. 捕获手指按下（此时还不知道是点击还是滑动）
        inputWrapper.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'touch') return;
            isPanning = false;
            startX = e.clientX;
            initialScrollLeft = inputWrapper.scrollLeft;
        }, { capture: true }); // 使用 capture: true 确保我们在 MathLive 之前拿到事件

        // 2. 捕获手指移动（判定意图的生死线）
        inputWrapper.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'touch') return;

            const deltaX = e.clientX - startX;

            // 如果水平移动超过 8px，我们判定这是“滑动滚动”，而不是“点击插光标”
            if (!isPanning && Math.abs(deltaX) > 8) {
                isPanning = true;

                // 【核心魔法】：给 MathLive 发送“触摸被系统取消”的假情报！
                // 强制打断 MathLive 内部试图生成蓝色高亮选区的逻辑
                mf.dispatchEvent(new PointerEvent('pointercancel', {
                    pointerId: e.pointerId,
                    pointerType: 'touch'
                }));
            }

            // 如果确认是滑动状态
            if (isPanning) {
                // 接管滚动权，强行推着 Wrapper 跑
                inputWrapper.scrollLeft = initialScrollLeft - deltaX;

                // 【拦截】：把事件就地销毁，不让下层的 MathLive 看到任何滑动过程
                e.stopPropagation();
                e.preventDefault();
            }
        }, { capture: true });

        // 3. 捕获手指抬起
        inputWrapper.addEventListener('pointerup', (e) => {
            if (e.pointerType !== 'touch') return;
            if (isPanning) {
                // 如果刚刚发生了滑动，拦截抬起事件，防止滑动停止瞬间触发一次错误的点击
                e.stopPropagation();
                isPanning = false;
            }
        }, { capture: true });
    });
</script>
</body>

</html>
