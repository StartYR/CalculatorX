<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台渲染暗房</title>
    <script src="mathlive.min.js"></script>
    <script src="html2canvas.min.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background-color: transparent;">

<script>
    /**
     * 将输入和输出的 LaTeX 渲染为静态 DOM 并截取为透明底黑字的 Base64 图片
     * 供 ArkTS 侧的 renderWebController 显式调用
     */
    window.exportLatexToPng = async function(inputLatex, outputLatex) {
        try {
            // 定义一个通用函数，用来“扁平化” math-field 并截图
            async function captureMathField(latex) {
                // 1. 创建真实的 math-field 组件，触发原生引擎
                const mf = document.createElement('math-field');
                mf.value = latex;
                // 必须在屏幕外，但必须有物理尺寸，否则引擎会跳过排版
                mf.style.position = 'absolute';
                mf.style.top = '-9999px';
                mf.style.fontSize = '32px'; // 保证高清
                mf.style.color = '#000000'; // 强制黑字
                document.body.appendChild(mf);

                // 2. 给引擎 100ms 的时间，确保它把字体文件下载好，把分数线完全画出来
                await new Promise(r => setTimeout(r, 100));

                // 3. 核心大招：剥除 Shadow DOM 的隐身衣！
                const wrapper = document.createElement('div');
                wrapper.className = 'ML__clone'; // 贴上我们的专属标签
                wrapper.style.position = 'absolute';
                wrapper.style.top = '-9999px';
                wrapper.style.display = 'inline-block'; // 收紧黑边，解决位置偏移
                wrapper.style.color = '#000000';
                wrapper.style.padding = '8px';

                // 将影子内部的所有 HTML（包括它自带的专属 <style>）整个挖出来
                let shadowHtml = mf.shadowRoot.innerHTML;
                // 狸猫换太子：让原本属于 :host 的样式，认 wrapper 为主人
                shadowHtml = shadowHtml.replace(/:host/g, '.ML__clone');

                wrapper.innerHTML = shadowHtml;
                document.body.appendChild(wrapper);

                // 4. 使用 html2canvas 截图 (此时全是普通 DOM，它绝对能看懂！)
                const canvas = await html2canvas(wrapper, {
                    backgroundColor: null, // 依然是透明底
                    scale: 2,
                    logging: false
                });

                // 5. 毁尸灭迹，释放内存
                document.body.removeChild(mf);
                document.body.removeChild(wrapper);

                return canvas.toDataURL('image/png');
            }

            // 分别对输入和输出执行“降维截图”
            const base64In = await captureMathField(inputLatex);
            const base64Out = await captureMathField(outputLatex);

            // 主动回调，呼叫 ArkTS 存入数据库
            if (window.arktsBridge && window.arktsBridge.onImageReady) {
                window.arktsBridge.onImageReady(JSON.stringify({
                    inputBase64: base64In,
                    outputBase64: base64Out,
                    inputLatex: inputLatex,
                    outputLatex: outputLatex
                }));
            }

        } catch (err) {
            console.error("图片生成失败:", err);
            if (window.arktsBridge && window.arktsBridge.onImageReady) {
                window.arktsBridge.onImageReady(JSON.stringify({ error: err.toString() }));
            }
        }
    };
</script>

</body>
</html>
