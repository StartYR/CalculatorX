<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台渲染暗房</title>
    <script src="mathlive.min.js"></script>
    <script src="html2canvas.min.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background-color: transparent;">

<script>
    /**
     * 将输入和输出的 LaTeX 渲染为静态 DOM 并截取为透明底黑字的 Base64 图片
     * 供 ArkTS 侧的 renderWebController 显式调用
     */
    window.exportLatexToPng = async function(inputLatex, outputLatex) {
        try {
            // 1. 建造“隐藏小黑屋”，强制脱离系统深浅模式的影响
            const container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.top = '0px';
            container.style.left = '0px';
            container.style.color = '#000000'; // 强制绝对黑色字体
            container.style.backgroundColor = 'transparent'; // 强制透明底
            // 设置一个较大的基础字号，保证生成的图片在移动端高分屏上足够清晰
            container.style.fontSize = '32px';
            container.style.padding = '12px';  // 留出内边距，防止字体的边缘（如积分号顶部）被切掉
            // 引入 MathLive 默认的排版字体
            container.style.fontFamily = 'KaTeX_Math, Cambria Math, serif';

            document.body.appendChild(container);

            // 2. 避开 Web Component 的 Shadow DOM 截图黑洞
            // 利用 convertLatexToMarkup 将其降维成纯正的 HTML <span> 标签节点
            const htmlIn = MathLive.convertLatexToMarkup(inputLatex);
            const htmlOut = MathLive.convertLatexToMarkup(outputLatex);

            // 挂载输入的 DOM
            const divIn = document.createElement('div');
            divIn.innerHTML = htmlIn;
            container.appendChild(divIn);

            // 挂载输出的 DOM
            const divOut = document.createElement('div');
            divOut.innerHTML = htmlOut;
            // 因为我们分别截图，不需要它们在 DOM 里有具体的上下间距，直接追加即可
            container.appendChild(divOut);

            // 3. 给浏览器排版引擎一点喘息时间（50ms），确保复杂的积分号、分式完全对齐就位
            await new Promise(resolve => setTimeout(resolve, 50));

            // 4. 配置 html2canvas
            const opt = {
                backgroundColor: null, // 强制透明底
                scale: 2,              // 2倍超采样，保证锐利度
                logging: false,        // 关闭控制台日志，提升性能
                useCORS: true          // 允许跨域（虽然本地不需要，但加上可防玄学报错）
            };

            // 5. 分别进行精准截图
            const canvasIn = await html2canvas(divIn, opt);
            const canvasOut = await html2canvas(divOut, opt);

            // 6. 提取并压缩为 Base64 字符串
            const base64In = canvasIn.toDataURL('image/png');
            const base64Out = canvasOut.toDataURL('image/png');

            // 7. 销毁小黑屋，清理 DOM 节点释放内存
            document.body.removeChild(container);

            // 8. 主动呼叫 ArkTS 注入的桥接方法
            if (window.arktsBridge && window.arktsBridge.onImageReady) {
                window.arktsBridge.onImageReady(JSON.stringify({
                    inputBase64: base64In,
                    outputBase64: base64Out,
                    inputLatex: inputLatex,     // 原样传回给 ArkTS 存库
                    outputLatex: outputLatex    // 原样传回给 ArkTS 存库
                }));
            }

        } catch (err) {
            console.error("图片生成失败:", err);
            return JSON.stringify({ error: err.toString() });
        }
    };
</script>

</body>
</html>
